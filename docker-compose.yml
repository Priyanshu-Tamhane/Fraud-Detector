services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    container_name: fraudshield-redpanda
    command:
      - redpanda start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: fraudshield-postgres
    environment:
      - POSTGRES_USER=fraudshield
      - POSTGRES_PASSWORD=fraudshield
      - POSTGRES_DB=fraudshield_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraudshield-api
    ports:
      - "8000:8000"
    environment:
      - FRAUDSHIELD_ENVIRONMENT=development
      - FRAUDSHIELD_LOG_LEVEL=INFO
      - FRAUDSHIELD_API__HOST=0.0.0.0
      - FRAUDSHIELD_API__PORT=8000
      - FRAUDSHIELD_API__MODEL_PATH=artifacts/models/best_fraud_model.joblib
      - FRAUDSHIELD_KAFKA__BOOTSTRAP_SERVERS=redpanda:29092
      - FRAUDSHIELD_DATABASE__POSTGRES_URL=postgresql://fraudshield:fraudshield@postgres:5432/fraudshield_db
    volumes:
      - ./artifacts:/app/artifacts:ro
    depends_on:
      - redpanda
      - postgres
    restart: unless-stopped

  stream-processor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraudshield-stream-processor
    command: ["python", "-m", "apps.stream_processor.processor"]
    environment:
      - FRAUDSHIELD_ENVIRONMENT=development
      - FRAUDSHIELD_LOG_LEVEL=INFO
      - FRAUDSHIELD_KAFKA__BOOTSTRAP_SERVERS=redpanda:29092
      - FRAUDSHIELD_DATABASE__POSTGRES_URL=postgresql://fraudshield:fraudshield@postgres:5432/fraudshield_db
      - FRAUDSHIELD_API__MODEL_PATH=artifacts/models/best_fraud_model.joblib
    volumes:
      - ./artifacts:/app/artifacts:ro
    depends_on:
      - redpanda
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
